[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-studio-local"
version = "0.1.18"
description = "A local PDF desktop workspace with optional browser mode"
requires-python = ">=3.12"
dependencies = ["Flask==3.1.3", "PyMuPDF==1.28.0", "Pillow==12.3.0", "openpyxl==3.1.5", "pypdf==6.14.2", "Markdown==3.11.2", "pywebview==6.2.1; sys_platform == 'win32'", "pythonnet==3.2.1; sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pdfstudio*"]
